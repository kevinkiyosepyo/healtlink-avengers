AWSTemplateFormatVersion: "2010-09-09"
Description: >
  lookahead on AWS: one App Runner service running the container (frontend,
  Google sign-in, opt-in cloud backup API) and a DynamoDB table for backups.
  Secrets live in Secrets Manager; nothing sensitive is passed as plain text.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI, e.g. 123456789012.dkr.ecr.us-west-2.amazonaws.com/lookahead:latest
  AuthUrl:
    Type: String
    Description: Public https origin of the service (the App Runner URL or a custom domain). Must match the Google OAuth callback origin.
  AuthSecretArn:
    Type: String
    Description: Secrets Manager ARN holding AUTH_SECRET (32+ random bytes, base64).
  GoogleClientIdArn:
    Type: String
    Description: Secrets Manager ARN holding AUTH_GOOGLE_ID.
  GoogleClientSecretArn:
    Type: String
    Description: Secrets Manager ARN holding AUTH_GOOGLE_SECRET.

Resources:
  BackupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user, AttributeType: S }
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: user, KeyType: HASH }
        - { AttributeName: id, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  # Lets App Runner pull the image from ECR.
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # What the running container may do: this table and these secrets, nothing else.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lookahead-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: !GetAtt BackupTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AuthSecretArn, !Ref GoogleClientIdArn, !Ref GoogleClientSecretArn]

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: lookahead
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref ImageUri
          ImageConfiguration:
            Port: "8787"
            RuntimeEnvironmentVariables:
              - { Name: NODE_ENV, Value: production }
              - { Name: AUTH_URL, Value: !Ref AuthUrl }
              - { Name: SYNC_TABLE, Value: !Ref BackupTable }
              - { Name: AWS_REGION, Value: !Ref AWS::Region }
            RuntimeEnvironmentSecrets:
              - { Name: AUTH_SECRET, Value: !Ref AuthSecretArn }
              - { Name: AUTH_GOOGLE_ID, Value: !Ref GoogleClientIdArn }
              - { Name: AUTH_GOOGLE_SECRET, Value: !Ref GoogleClientSecretArn }
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Description: Public URL (set AuthUrl to this, or to your custom domain, and add <AuthUrl>/api/auth/callback/google in Google Cloud).
    Value: !Sub "https://${Service.ServiceUrl}"
  BackupTableName:
    Value: !Ref BackupTable
