<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #12110f; }
    .ring { fill: none; stroke: #faf9f5; stroke-width: 2.4; }
    .pupil { fill: #cc785c; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #faf9f5; }
      .ring { stroke: #141413; }
    }
  </style>
  <!-- lookahead: two eyes, pupils looking ahead -->
  <rect class="tile" width="32" height="32" rx="8"/>
  <circle class="ring" cx="9.5" cy="16" r="5.2"/>
  <circle class="ring" cx="22.5" cy="16" r="5.2"/>
  <circle class="pupil" cx="11.9" cy="16" r="2.2"/>
  <circle class="pupil" cx="24.9" cy="16" r="2.2"/>
</svg>
